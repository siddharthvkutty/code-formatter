<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Broken Page</title>
</head>
<body>

    <!-- 1. Missing closing tag -->
    <h1>Welcome to My Website
    <p>This is a paragraph under a heading that never closed.</p>

    <!-- 2. Incorrect nesting (Tags overlap) -->
    <p>This text is <strong>bold and <em>italic</strong> properly?</em></p>

    <!-- 3. Misspelled/Malformed closing tag -->
    <div>
        <p>We are testing a broken div container.</p>
    </pdiv> <!-- Incorrect spelling -->

    <!-- 4. Unclosed quote in an attribute -->
    <a href="https://example.com>Click here to visit Example</a>

    <!-- 5. Misspelled tag name -->
    <immg src="image.jpg" alt="A broken image tag">

</body>
</html>
